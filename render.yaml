# Render Blueprint: https://render.com/docs/blueprint-spec
# Dev environment, deployed from the develop branch.
services:
  - type: web
    name: forge-api-dev
    runtime: docker
    # Starter or above: free instances sleep (stopping the scheduler) and
    # don't support preDeployCommand or Shell.
    plan: starter
    region: frankfurt
    branch: develop
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    preDeployCommand: alembic upgrade head
    envVars:
      - key: ENVIRONMENT
        value: development
      - key: DATABASE_URL
        fromDatabase:
          name: forge-db-dev
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DATA_ENCRYPTION_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: EMAIL_FROM_ADDRESS
        value: noreply@kamilimu.org
      - key: SCHEDULER_ENABLED
        value: "true"
      - key: TRUSTED_PROXY_HOPS
        value: "1"

databases:
  - name: forge-db-dev
    databaseName: forge
    user: forge
    plan: basic-256mb
    region: frankfurt
    postgresMajorVersion: "16"
    ipAllowList: []
